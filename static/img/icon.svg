<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>policlase</title>
  <!-- Escudo inspirado en la identidad de la EPN (silueta y colores: azul marino, rojo, dorado);
       dentro, el símbolo propio de policlase: los resultados de una pregunta en vivo. -->
  <defs>
    <linearGradient id="navy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14386E"/>
      <stop offset="1" stop-color="#021E40"/>
    </linearGradient>
    <clipPath id="shield">
      <path d="M92 40h328a28 28 0 0 1 28 28v190c0 118-86 182-192 222C150 440 64 376 64 258V68a28 28 0 0 1 28-28z"/>
    </clipPath>
  </defs>
  <g clip-path="url(#shield)">
    <rect width="512" height="512" fill="url(#navy)"/>
    <rect width="512" height="150" fill="#D52B1E"/>
    <rect y="150" width="512" height="10" fill="#FFC600"/>
  </g>
  <path d="M92 40h328a28 28 0 0 1 28 28v190c0 118-86 182-192 222C150 440 64 376 64 258V68a28 28 0 0 1 28-28z"
        fill="none" stroke="#FFC600" stroke-width="14"/>
  <!-- punto «en vivo» en la franja roja -->
  <circle cx="256" cy="95" r="26" fill="#FFFFFF"/>
  <!-- barras de una votación en vivo, la correcta con ✓ -->
  <rect x="150" y="292" width="54" height="74" rx="9" fill="#FFC600" opacity=".75"/>
  <rect x="229" y="248" width="54" height="118" rx="9" fill="#FFC600" opacity=".85"/>
  <rect x="308" y="198" width="54" height="168" rx="9" fill="#FFC600"/>
  <path d="M319 236l14 14 22-25" fill="none" stroke="#021E40" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
