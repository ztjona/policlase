{% load i18n %}{% if c %}<button type="button" class="grade {% if c.correct %}ok{% elif c.points %}warn{% else %}danger{% endif %}{% if c.edited %} edited{% endif %}"
  data-url="{% url 'response_grade' session.pk c.pk %}" data-points="{{ c.points|stringformat:'g' }}" data-max="{{ full|stringformat:'g' }}" data-edited="{{ c.edited|yesno:'1,' }}"
  title="{% if c.edited %}{% blocktranslate with auto=c.auto_points|floatformat:'-1' %}Corregida a mano (automática: {{ auto }}). Clic para cambiarla.{% endblocktranslate %}{% else %}{% translate 'Clic para corregir la nota' %}{% endif %}">{{ c.points|floatformat:"-1" }}{% if c.edited %}<span class="edit-mark" aria-label="{% translate 'corregida a mano' %}">✎</span>{% endif %}</button>{% else %}<span class="muted">—</span>{% endif %}
