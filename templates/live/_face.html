{# Carita de valoración 1–5 en SVG: se ve igual en cualquier dispositivo (los emojis no). #}
<svg class="face" viewBox="0 0 36 36" width="34" height="34" aria-hidden="true">
  <circle cx="18" cy="18" r="16" fill="none" stroke="currentColor" stroke-width="2.4"/>
  <circle cx="12.5" cy="14.5" r="2.1" fill="currentColor"/><circle cx="23.5" cy="14.5" r="2.1" fill="currentColor"/>
  {% if n == 1 %}<path d="M11 26c3.5-5 10.5-5 14 0" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
  {% elif n == 2 %}<path d="M12 25c3-2.6 9-2.6 12 0" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
  {% elif n == 3 %}<path d="M12 24h12" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
  {% elif n == 4 %}<path d="M12 22c3 3.2 9 3.2 12 0" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
  {% else %}<path d="M10.5 21h15c-1 5.5-4 8-7.5 8s-6.5-2.5-7.5-8z" fill="currentColor"/>{% endif %}
</svg>
